name: Run JavaScript Script

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Updated to Node 22 to match runner expectations

      - name: Run script
        run: node script.js
